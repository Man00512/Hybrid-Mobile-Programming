<ion-app>
  <ion-tabs>
    <ion-router-outlet id="main-content"></ion-router-outlet>

    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="dashboard">
        <ion-icon name="home"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="produk">
        <ion-icon name="cube"></ion-icon>
        <ion-label>Produk</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="transaksi">
        <ion-icon name="receipt"></ion-icon>
        <ion-label>Transaksi</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="profil">
        <ion-icon name="person"></ion-icon>
        <ion-label>Profil</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>

  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu Tambahan</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/pengaturan">
            <ion-icon name="settings" slot="start"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
          <ion-item button routerLink="/tentang">
            <ion-icon name="information-circle" slot="start"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
          <ion-item button lines="none">
            <ion-icon name="log-out" slot="start" color="danger"></ion-icon>
            <ion-label color="danger">Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
</ion-app>
